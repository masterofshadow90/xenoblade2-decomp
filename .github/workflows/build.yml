name: Decompilation Progress Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Install additional required runtime tools
      - name: Install Runtime Dependencies
        run: |
          apt-get update
          apt-get install -y ninja-build wget

      # 2. Fix compiler paths from Windows format to Linux format inside the tools folder
      - name: Adjust Pipeline Tools Path for Linux CI
        run: |
          sed -i 's|D:/devkitPro/devkitA64/bin/|/opt/devkitpro/devkitA64/bin/|g' tools/pipeline_ninja.py

      # 3. Create required output base and target directories for object files
      - name: Create Build Directories
        run: |
          mkdir -p build/base build/target data

      # 4. Generate build.ninja orchestrator layout and move the generated objdiff configuration map to root
      - name: Run Orchestrator and Build
        run: |
          python3 tools/pipeline_ninja.py
          if [ -f tools/objdiff.json ]; then mv tools/objdiff.json ./objdiff.json; fi
          ninja

      # 5. Retrieve the targeted objdiff-cli binary using the official GitHub Release action module
      - name: Download objdiff CLI via Official Release Action
        uses: robinraju/release-downloader@v1.11
        with:
          repository: "encounter/objdiff"
          latest: true
          fileName: "objdiff-cli-linux-x86_64"

      # 6. Format execution permissions and generate the final progress data payload utilizing decomp.dev naming scheme
      - name: Run objdiff CLI Report
        run: |
          mv objdiff-cli-linux-x86_64 objdiff-cli
          chmod +x objdiff-cli
          ./objdiff-cli report generate -o F77F1559371C0EC6D50E78774AC59D95_report.json
          chmod 644 F77F1559371C0EC6D50E78774AC59D95_report.json

      # 7. Publish the resulting JSON archive using the official build_id naming convention required by the platform backend
      - name: Upload Progress Artifact
        uses: actions/upload-artifact@v4
        with:
          name: F77F1559371C0EC6D50E78774AC59D95_report
          path: ./F77F1559371C0EC6D50E78774AC59D95_report.json
          if-no-files-found: error


