name: Decompilation Progress Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Instalar herramientas adicionales necesarias
      - name: Install Runtime Dependencies
        run: |
          apt-get update
          apt-get install -y ninja-build wget

      # 2. Corregir las rutas de Windows a Linux apuntando DIRECTAMENTE a la carpeta tools
      - name: Adjust Pipeline Tools Path for Linux CI
        run: |
          sed -i 's|D:/devkitPro/devkitA64/bin/|/opt/devkitpro/devkitA64/bin/|g' tools/pipeline_ninja.py

      # 3. Crear directorios base necesarios para los .o
      - name: Create Build Directories
        run: |
          mkdir -p build/base build/target data

      # 4. Generar el plano build.ninja y mover el objdiff.json generado a la raíz
      - name: Run Orchestrator and Build
        run: |
          python3 tools/pipeline_ninja.py
          if [ -f tools/objdiff.json ]; then mv tools/objdiff.json ./objdiff.json; fi
          ninja

      # 5. Descargar objdiff-cli usando la Action oficial de GitHub
      - name: Download objdiff CLI via Official Release Action
        uses: robinraju/release-downloader@v1.11
        with:
          repository: "encounter/objdiff"
          latest: true
          fileName: "objdiff-cli-linux-x86_64"

      # 6. Renombrar, dar permisos y generar el reporte JSON final para decomp.dev
      - name: Run objdiff CLI Report
        run: |
          mv objdiff-cli-linux-x86_64 objdiff-cli
          chmod +x objdiff-cli
          ./objdiff-cli report generate -o progress.json

      # 7. Publicar el artefacto para que decomp.dev lo absorba automáticamente
      - name: Upload Progress Artifact
        uses: actions/upload-artifact@v4
        with:
          name: progress
          path: progress.json
