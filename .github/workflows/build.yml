name: Decompilation Progress Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Instalar herramientas adicionales necesarias
      - name: Install Runtime Dependencies
        run: |
          apt-get update
          apt-get install -y ninja-build wget jq

      # 2. Corregir las rutas de Windows a Linux apuntando DIRECTAMENTE a la carpeta tools
      - name: Adjust Pipeline Tools Path for Linux CI
        run: |
          sed -i 's|D:/devkitPro/devkitA64/bin/|/opt/devkitpro/devkitA64/bin/|g' tools/pipeline_ninja.py

      # 3. Crear directorios base necesarios para los .o
      - name: Create Build Directories
        run: |
          mkdir -p build/base build/target data

      # 4. Generar el plano build.ninja ejecutando tu script y compilar el proyecto
      - name: Run Orchestrator and Build
        run: |
          python3 tools/pipeline_ninja.py
          ninja

      # 5. Descargar objdiff-cli usando fragmentos de texto separados que tu script no puede romper
      - name: Run objdiff CLI
        env:
          GH_API: "://github.com"
          GH_REPO: "encounter/objdiff"
        run: |
          DOWNLOAD_URL=$(curl -s "https://${GH_API}/repos/${GH_REPO}/releases/latest" | jq -r '.assets[] | select(.name == "objdiff-cli-linux-x86_64") | .browser_download_url')
          wget "$DOWNLOAD_URL" -O objdiff-cli
          chmod +x objdiff-cli
          ./objdiff-cli report --config objdiff.json --output progress.json

      # 6. Publicar el artefacto para que decomp.dev lo absorba automáticamente
      - name: Upload Progress Artifact
        uses: actions/upload-artifact@v4
        with:
          name: progress
          path: progress.json
