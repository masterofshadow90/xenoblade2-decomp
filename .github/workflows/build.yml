name: Decompilation Progress Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    # Usamos la imagen oficial de devkitPro que ya tiene los compiladores de Switch
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Instalar herramientas adicionales necesarias dentro del contenedor
      - name: Install Runtime Dependencies
        run: |
          apt-get update
          apt-get install -y ninja-build wget

      # 2. Corregir las rutas de Windows a Linux en tu orquestador de Python
      - name: Adjust Pipeline Tools Path for Linux CI
        run: |
          sed -i 's|D:/devkitPro/devkitA64/bin/|/opt/devkitpro/devkitA64/bin/|g' pipeline_ninja.py

      # 3. Crear directorios base necesarios para los .o
      - name: Create Build Directories
        run: |
          mkdir -p build/base build/target data

      # 4. Generar el plano build.ninja ejecutando tu script y compilar el proyecto
      - name: Run Orchestrator and Build
        run: |
          python3 pipeline_ninja.py
          ninja

      # 5. Descargar objdiff-cli y generar el reporte JSON requerido por decomp.dev
      # Usamos el binario de Linux de objdiff que se ejecutará sin problemas en el contenedor
      - name: Run objdiff CLI
        run: |
          wget https://github.com -O objdiff-cli
          chmod +x objdiff-cli
          ./objdiff-cli report --project . --output progress.json

      # 6. Publicar el artefacto para que decomp.dev lo absorba automáticamente
      - name: Upload Progress Artifact
        uses: actions/upload-artifact@v4
        with:
          name: progress
          path: progress.json
